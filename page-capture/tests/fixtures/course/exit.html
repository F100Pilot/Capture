<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><title>Lição</title></head>
<body>
<h1>Lição com registo ao sair</h1>
<script>
  // como um conteúdo SCORM/AICC: pede confirmação ao sair e envia o estado ao LMS
  addEventListener('beforeunload', ev => { ev.preventDefault(); ev.returnValue = ''; });
  addEventListener('pagehide', () => navigator.sendBeacon('/lms/exit', 'completed'));
</script>
</body>
</html>
